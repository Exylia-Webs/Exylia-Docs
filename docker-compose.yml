services:
  docs:
    build:
      context: .
      secrets: [NPMRC]
    image: exylia-docs:latest
    container_name: exylia-docs
    restart: unless-stopped
    # AI_* and TURNSTILE_* (see .env.example); without AI_MODEL the assistant is off.
    env_file:
      - path: .env
        required: false
    ports:
      # Same port the dev server uses, so nothing changes between environments.
      - "3010:80"
    volumes:
      # The assistant's monthly token count, kept across restarts and rebuilds.
      - docs-data:/app/data

secrets:
  NPMRC:
    environment: NPMRC

volumes:
  docs-data:
