# sharp is only used by next/image optimization. This site exports static HTML
# with images.unoptimized, so its build script is deliberately never run and
# pnpm is told so explicitly instead of stopping to ask on every install.
allowBuilds:
  sharp: false
  # The Prisma CLI's engines (migrate deploy runs as the container starts).
  '@prisma/engines': true
  prisma: true
  # Pulled in by next-intl (the admin panel); never built.
  '@parcel/watcher': false
  '@swc/core': false

# The design system is ours: a release is installable the moment it is published.
minimumReleaseAgeExclude:
  - '@exylia-webs/ui'

overrides:
  # prisma pins a mysql2 with GHSA-3f6p-5ww8-9rcr and GHSA-rgwj-5xj2-c3m3; Postgres never loads it, but keep it patched.
  mysql2: '>=3.23.1'
